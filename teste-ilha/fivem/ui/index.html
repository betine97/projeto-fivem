<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Mapa da ilha</title>
<style>body{margin:0;background:transparent;font:16px system-ui;color:white}main{display:none;position:absolute;inset:4vh 12vw;background:#132b32f5;border-radius:18px;overflow:hidden;box-shadow:0 0 70px #0008}header{padding:14px 22px;display:flex;justify-content:space-between;align-items:center}button{background:#fff2;color:white;border:1px solid #fff5;border-radius:8px;padding:8px 16px;cursor:pointer}section{height:82vh;position:relative;display:flex;justify-content:center}.map{position:relative;height:100%;aspect-ratio:1800/1400}img{width:100%;height:100%;object-fit:contain}.player{position:absolute;width:16px;height:16px;background:#ffe183;border:3px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px #000;display:none}footer{position:absolute;bottom:12px;left:22px;color:#cfdfdf;font-size:13px}</style>
<main><header><strong>TESTE ILHA · 3,37 km²</strong><button id="close">Fechar · ESC</button></header><section><div class="map"><img src="mapa.png" alt="Mapa de relevo da ilha"><span class="player"></span></div></section><footer>Praias · montanhas · lago · rio · pista de pouso &nbsp; | &nbsp; F8: ilha para voltar à pista</footer></main>
<script>const panel=document.querySelector('main'),marker=document.querySelector('.player');let bounds=null;fetch('../data/mapa.json').then(r=>r.json()).then(v=>bounds=v);window.addEventListener('message',e=>{const d=e.data;if(d.action==='open')panel.style.display='block';if(d.action==='close')panel.style.display='none';if(d.action==='position'&&bounds){marker.style.display='block';marker.style.left=((d.x-bounds.minX)/(bounds.maxX-bounds.minX)*100)+'%';marker.style.top=((bounds.maxY-d.y)/(bounds.maxY-bounds.minY)*100)+'%'}});function close(){fetch(`https://${GetParentResourceName()}/close`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}document.querySelector('#close').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></html>
