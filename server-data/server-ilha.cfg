# Mundo exclusivo da ilha. Cidade original em server-cidade.cfg.
setr cidade_modo ilha
set sv_enforceGameBuild 3258
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_hostname "Teste Ilha | Mundo independente"
sets sv_projectName "Teste Ilha"
sets sv_projectDesc "Ilha autoral com praias, montanhas e rio"
sets locale "pt-BR"
sv_maxclients 16
sv_scriptHookAllowed 0
sv_master1 ""
set onesync on
exec secrets.cfg
exec acesso.cfg
exec permissoes-amigos.cfg

