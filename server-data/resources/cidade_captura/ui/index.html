<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capturar objetos</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app" hidden><header><div><small>MINHA CIDADE · CATÁLOGO COMPARTILHADO</small><h1>Escolha um objeto do mapa</h1><p id="hint">Los Santos ou Cayo Perico: aponte e clique no objeto marcado em verde.</p></div><button id="close">Fechar · Esc</button></header>
<section id="selection" hidden><small id="kind">OBJETO SELECIONADO</small><h2 id="title"></h2><p id="details"></p><label>Nome no catálogo<input id="name" maxlength="80" autocomplete="off"></label><label>Categoria<select id="category"><option>Objetos de Los Santos</option><option>Árvores e palmeiras</option><option>Arbustos, grama e plantas</option><option>Pedras e rochas</option><option>Água e infraestrutura</option><option>Cercas e barreiras</option><option>Construções</option><option>Estradas e iluminação</option><option>Objetos e decoração</option></select></label><div class="buttons"><button id="again">Escolher outro</button><button id="save" class="primary">Adicionar ao catálogo da ilha</button></div></section>
<aside id="toast" hidden role="status"></aside><footer>Esc: voltar a andar ou voar · F8: capturarobjeto para selecionar novamente · capturas: consultar marcações</footer></main><script src="app.js"></script></body></html>
