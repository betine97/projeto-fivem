# Servidor separado: Los Santos original, com cache próprio e captura de objetos.
setr cidade_modo cidade
set cidade_servidor_id los-santos
set sv_enforceGameBuild 3258
endpoint_add_tcp "0.0.0.0:30121"
endpoint_add_udp "0.0.0.0:30121"
sv_hostname "Minha Cidade | Los Santos · Captura de objetos"
sets sv_projectName "Los Santos original"
sets sv_projectDesc "Selecione objetos originais para o catálogo das ilhas"
sets locale "pt-BR"
sv_maxclients 16
sv_scriptHookAllowed 0
sv_master1 ""
set onesync on
set cidade_captura_url "http://127.0.0.1:8788"
exec secrets.cfg
exec acesso.cfg
exec permissoes-amigos.cfg
ensure cidade_acesso
ensure cidade_admin
ensure spawnmanager
ensure cidade_core
ensure cidade_captura
