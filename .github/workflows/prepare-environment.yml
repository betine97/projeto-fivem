name: Preparar ambiente
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a preparar
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: prepare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Conferir a branch do ambiente
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENV" = prod ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Produção só pode ser preparada a partir de main.' >&2
            exit 1
          fi
          if [ "$TARGET_ENV" = dev ] && [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo 'Desenvolvimento compartilhado usa develop.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ci.txt
      - name: Repetir as validações na revisão que será empacotada
        run: python tools/ci.py
      - name: Baixar somente assets que o servidor utiliza
        run: |
          git lfs install --local
          git lfs pull --include="server-data/resources/**" --exclude=""
          python tools/bootstrap.py --check-assets
      - name: Identificar imagem
        id: image
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$TARGET_ENV-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Preparar kit do ambiente sem chaves
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: python tools/prepare_environment.py --environment "$TARGET_ENV" --image "$IMAGE" --output dist/environment
      - uses: actions/upload-artifact@v4
        with:
          name: ambiente-${{ inputs.environment }}-${{ github.sha }}
          path: dist/environment
          retention-days: 14
          include-hidden-files: true
      - name: Resultado
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          echo "Imagem preparada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'O kit contém Compose e instruções. Nenhum servidor foi implantado automaticamente.' >> "$GITHUB_STEP_SUMMARY"
